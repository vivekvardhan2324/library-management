<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Book - Library Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <span class="brand">&#128218; Library Management</span>
    <a href="index.html">Home</a>
    <a href="add-book.html">Add Book</a>
    <a href="books">View Books</a>
  </nav>
  <main>
    <h2>Add Book</h2>
    <form class="card" method="post" action="add">
      <label>Book Name<input type="text" name="bname" maxlength="20" required></label>
      <label>Author<input type="text" name="author" maxlength="20" required></label>
      <label>Type<input type="text" name="type" maxlength="20" required></label>
      <label>Price<input type="number" name="price" step="0.01" min="0" required></label>
      <button class="btn" type="submit">Add Book</button>
    </form>
  </main>
</body>
</html>
